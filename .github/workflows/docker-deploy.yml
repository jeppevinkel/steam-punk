name: Docker

# Image tagging strategy (ghcr.io/jeppevinkel/steam-punk):
#   pull_request     -> pr-<number>, pr-<number>-<sha>   (preview/test builds)
#   push to master   -> nightly, nightly-<date>-<sha>     (latest unreleased build)
#   release          -> <version>, <major>.<minor>, <major>, latest (latest skipped for pre-releases)

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & Publish
    runs-on: ubuntu-latest

    # PRs from forks get a read-only token, so only validate the build for those.
    env:
      PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      DEV_WEBHOOK: ${{ secrets.CONTAINER_DEV_WEBHOOK }}
      PROD_WEBHOOK: ${{ secrets.CONTAINER_PROD_WEBHOOK }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=pr
            type=raw,value=pr-${{ github.event.pull_request.number }}-{{sha}},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=nightly,enable=${{ github.event_name != 'pull_request' && github.event_name != 'release' && github.ref == 'refs/heads/master' }}
            type=raw,value=nightly-{{date 'YYYYMMDD'}}-{{sha}},enable=${{ github.event_name != 'pull_request' && github.event_name != 'release' && github.ref == 'refs/heads/master' }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=steam-punk
            com.github.pull-request.number=${{ github.event.pull_request.number }}
            com.github.pull-request.branch=${{ github.head_ref }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image tags"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            [ "$PUSH" = "true" ] || echo "_Build only — image was not pushed._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger Dev Container Recreation
        uses: distributhor/workflow-webhook@v3
        if: github.event_name == 'push' && env.DEV_WEBHOOK != ''
        env:
          webhook_url: ${{ env.DEV_WEBHOOK }}

      - name: Trigger Prod Container Recreation
        uses: distributhor/workflow-webhook@v3
        if: github.event_name == 'release' && !github.event.release.prerelease && env.PROD_WEBHOOK != ''
        env:
          webhook_url: ${{ env.PROD_WEBHOOK }}
